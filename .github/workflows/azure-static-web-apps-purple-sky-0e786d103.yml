name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Fail the run before anything is deployed rather than shipping a build
      # with type errors: `next build` does not fail on them in this config.
      # These deps are only for the check — the deploy builds on its own.
      - run: npm ci
      - run: npm run typecheck
      # Fails on a broken docs page or consumer registry, so it can't ship.
      - run: npm run docs:check

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_SKY_0E786D103 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          # Next.js is detected and handled by the SWA build (Oryx), which knows
          # about .next itself. The CRA-style "build" default made the deploy
          # fail with "failed to produce artifact folder: 'build'"; an explicit
          # ".next" fails the same way. Empty is the correct value for Next.
          output_location: "" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
        # No env: block for the Resend variables on purpose. They are read at
        # request time by app/api/contact/route.ts, which runs on Azure, not in
        # this runner — passing them here only puts them in the build and the
        # route still sees them unset. They belong in the Static Web App's own
        # application settings; see "Contact form" in README.md.

  # Emails the consumer contacts about new docs changelog entries. Unlike
  # /api/contact, the send happens here in the runner, so RESEND_API_KEY is a
  # GitHub secret rather than an Azure application setting. It lives in this
  # workflow (not a separate paths-triggered one) so it only runs once the
  # deploy has succeeded.
  notify_docs_changes:
    needs: build_and_deploy_job
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Notify Docs Changes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Send docs change notifications
        run: node scripts/docs-notify.mjs "${{ github.event.before }}" "${{ github.sha }}"
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DOCS_FROM_EMAIL: ${{ vars.DOCS_FROM_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_SKY_0E786D103 }}
          action: "close"
